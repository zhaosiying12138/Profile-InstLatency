# YuShuXin-V2.1 RVV timing ground truth (micro-op-level parameters).
#
# KEY INSIGHT (learned from the gem5 v24.1.0.3 MinorFU sources): opLat and issueLat
# are FUNCTIONAL-UNIT-level constants, but MinorFUTiming.srcRegsRelativeLats is a
# per-instruction (mask/match) override. Therefore the implementable design space is:
#   - one FU per (pipe, issue-interval mu) pair;
#   - FU-wide opLat = max over its classes; per-class L via srcRegsRelativeLats:
#       L_micro(class) = opLat(FU) - srcLat(class)      (same-FU bypassed RAW)
#   - macro semantics emerge from gem5's micro-op splitting (lambda micro-ops,
#     one VLEN-wide group each, issued mu apart):
#       L_macro = L_micro + (lambda-1)*mu
#       R_macro = lambda*mu        (pipelined classes)
#       R_macro = L_macro = lambda*opLat   (non-pipelined: issueLat == opLat)
#   - cross-pipe RAW penalty = srcLat(producer)  (no cross-FU forwarding:
#     consumer waits for full writeback opLat instead of opLat - srcLat)
#   - WAW spacing = opLat + extraCommitLat(class) - srcLat(second write)
#   - WAR release = reader's srcLat (sources read at issue + srcLat)
#
# This file is the SINGLE SOURCE OF TRUTH: the gem5 FU-pool generator, the
# analytic model (yxmodel.py), and the LLVM TableGen values are all derived
# from it, and verify_timing_exactness.py asserts gem5 == analytic per template.
schema_version: 3
mode: synthetic_ground_truth

target:
  cpu: MinorCPU (RiscvMinorCPU)
  clock: 1GHz
  vlen: 256
  elen: 64
  sew: 32
  lmuls: [m1, m2, m4]

globals:
  issue_width: 2
  n_vector_pipes: 2          # VP0, VP1 (each = one issue port feeding sub-units)
  vlsu_beats: 1              # VLSU: one VLEN-group per beat
  load_hit_latency: 4

# Functional units. Each is (pipe, mu). opLat is FU-wide; per-class srcLat below.
fu_pools:
  - name: YX_VP0_ALU
    pipe: VP0
    mu: 1                    # issue interval (cycles) between micro-ops
    opLat: 6
    classes: [vadd_vv, vmseq_vv, viota_m, vcpop_m, vmul_vv]   # vmul also on VP1 => ANY
  - name: YX_VP0_PERM
    pipe: VP0
    mu: 2
    opLat: 6
    classes: [vslideup_vx]
  - name: YX_VP1_ALU
    pipe: VP1
    mu: 1
    opLat: 6
    classes: [vmul_vv]       # + mirrored slots make vmul ANY-pipe
  - name: YX_VP1_PERM
    pipe: VP1
    mu: 2
    opLat: 8
    classes: [vredsum_vs]
  - name: YX_VP1_DIV
    pipe: VP1
    mu: 12                   # non-pipelined: issueLat == opLat
    opLat: 12
    nonpipelined: true
    classes: [vdivu_vv]

instructions:
  vadd_vv:
    asm: "vadd.vv vd, vs2, vs1"
    fu: YX_VP0_ALU
    l_micro: 3      # L_macro = 3/4/6   (2 + 1*lambda)
    src_lat: 3      # = opLat(6) - l_micro ; also WAR release & cross-pipe penalty
    extra_commit_lat: 0
  vmul_vv:
    asm: "vmul.vv vd, vs2, vs1"
    fu: [YX_VP0_ALU, YX_VP1_ALU]     # ANY pipe
    l_micro: 4      # L_macro = 4/5/7   (3 + 1*lambda)
    src_lat: 2
    extra_commit_lat: 0
  vdivu_vv:
    asm: "vdivu.vv vd, vs2, vs1"
    fu: YX_VP1_DIV
    nonpipelined: true
    l_micro: 12     # L_macro = R_macro = 12/24/48 (12*lambda)
    src_lat: 2      # cross-pipe penalty 2
    extra_commit_lat: 0
  vmseq_vv:
    asm: "vmseq.vv vd, vs2, vs1"
    fu: YX_VP0_ALU
    l_micro: 2      # L_macro = 2/3/5   (1 + 1*lambda)
    src_lat: 4
    extra_commit_lat: 0
  vredsum_vs:
    asm: "vredsum.vs vd, vs2, vs1"
    fu: YX_VP1_PERM
    l_micro: 6      # L_macro = 6/8/10  (4 + 2*lambda)
    src_lat: 2      # = opLat(8) - 6
    extra_commit_lat: 0
  vslideup_vx:
    asm: "vslideup.vx vd, vs2, rs1"
    fu: YX_VP0_PERM
    l_micro: 4      # L_macro = 4/6/8   (2 + 2*lambda)
    src_lat: 2
    extra_commit_lat: 0
  vcpop_m:
    asm: "vcpop.m rd, vs2"      # single mask register: NOT split -> k == 0 (OpClass SimdMisc)
    fu: YX_VP0_ALU
    nosplit: true
    l_micro: 3      # L_macro = 3/3/3   (k = 0)
    src_lat: 3
    extra_commit_lat: 0
  viota_m:
    asm: "viota.m vd, vs2"
    fu: YX_VP0_ALU
    l_micro: 5      # L_macro = 5/6/8   (4 + 1*lambda)
    src_lat: 1
    extra_commit_lat: 0

# Derived macro table (what the profile must recover; keep in sync):
#   instr        pipe   L(m1/m2/m4)   R(m1/m2/m4)   xpipe_pen  waw_extra
#   vadd_vv      VP0    3/4/6         1/2/4         3          (opLat+ecL-srcLat)
#   vmul_vv      ANY    4/5/7         1/2/4         2          ...
#   vdivu_vv     VP1    12/24/48      12/24/48      2          +2
#   vmseq_vv     VP0    2/3/5         1/2/4         4          ...
#   vredsum_vs   VP1    6/8/10        2/4/8         2          +1
#   vslideup_vx  VP0    4/6/8         2/4/8         2          ...
#   vcpop_m      VP0    3/3/3         1/1/1         3          ...
#   viota_m      VP0    5/6/8         1/2/4         1          ...
# Distinctness: L (base,k): (2,1)(3,1)(0,12)(1,1)(4,2)(2,2)(3,0)(4,1) all distinct.
# vredsum/vslideup share R slope 2; vadd/vmul/vmseq/viota share R slope 1: the
# L dimension separates them, and equal-R/different-L is itself a teaching case.
